[package]
name = "commputer-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Blockchain state storage: blocks, accounts, proofs"

[features]
# Mirrors the node crate's flag. Shortens SCHEDULE_EPOCH_BLOCKS so the local
# formation harness — whose chains only reach ~100 blocks — actually crosses
# schedule-epoch boundaries. Compile-time only; never enabled for release.
formation-test = []

[dependencies]
commputer-core = { workspace = true }
# PoUW P2: the per-job verification lifecycle held in ChainState (the §3 Ledger-trait integration
# runs the staging lifecycle/settlement money logic against ChainState). No dep cycle: neither
# pouw-onchain nor pouw depends on storage. commputer-pouw supplies the trait/types the Ledger view
# uses directly (ChainHooks, ParticipantId, Commitment/Reveal, EquivalenceOracle).
commputer-pouw-onchain = { path = "../staging/pouw-onchain" }
commputer-pouw = { path = "../staging/pouw" }
serde = { workspace = true }
borsh = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
hex = "0.4"
rocksdb = { workspace = true }
ed25519-dalek = { workspace = true }

[dev-dependencies]
tempfile = "3"
