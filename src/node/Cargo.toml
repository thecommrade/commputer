[package]
name = "commputer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Commputer node: a communal supercomputer coordinated by blockchain"

[dependencies]
commputer-core = { workspace = true }
commputer-consensus = { workspace = true }
commputer-network = { workspace = true }
commputer-proofs = { workspace = true }
commputer-storage = { workspace = true }
commputer-validator = { workspace = true }
# PoUW on-chain wiring (P0): deterministic fuel-metered execution + adapters.
commputer-pouw = { path = "../staging/pouw", features = ["wasm-runtime"] }
commputer-pouw-onchain = { path = "../staging/pouw-onchain" }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
libp2p = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
hex = "0.4"
zeroize = "1"
sha2 = { workspace = true }
borsh = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
flate2 = { workspace = true }
tar = "0.4"
rayon = "1"
rand.workspace = true
chrono = { workspace = true }
dirs = "5"
toml = "0.8"

[build-dependencies]
chrono = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# Tier B test harnesses — property-based testing.
proptest = "1.4"
# Assemble a WASM guest for the pouw_executor determinism/linchpin test.
wat = "=1.251.0"
