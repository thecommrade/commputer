[package]
name = "commputer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Commputer node: a communal supercomputer coordinated by blockchain"

[features]
# Empties ALPHA_PINNED_VALIDATORS so the local formation harness can run
# multi-producer scenarios with randomly-generated test wallets. Compile-time
# only; never enabled for release builds.
formation-test = ["commputer-storage/formation-test"]

[dependencies]
commputer-core = { workspace = true }
commputer-consensus = { workspace = true }
commputer-network = { workspace = true }
commputer-proofs = { workspace = true }
commputer-storage = { workspace = true }
commputer-validator = { workspace = true }
# PoUW on-chain wiring (P0): deterministic fuel-metered execution + adapters.
commputer-pouw = { path = "../staging/pouw", features = ["wasm-runtime"] }
commputer-pouw-onchain = { path = "../staging/pouw-onchain" }
# Track-2 Phase 0 DA substrate: build_attestation / chunk_proof / chunk_hash for the
# job-blob publisher (src/node/src/da_publisher.rs). Inert until the PROTECTED wire-in.
commputer-da = { path = "../staging/da" }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
libp2p = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
hex = "0.4"
zeroize = "1"
sha2 = { workspace = true }
borsh = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
flate2 = { workspace = true }
tar = "0.4"
rayon = "1"
rand.workspace = true
chrono = { workspace = true }
dirs = "5"
toml = "0.8"

[build-dependencies]
chrono = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# Tier B test harnesses — property-based testing.
proptest = "1.4"
# Assemble a WASM guest for the pouw_executor determinism/linchpin test.
wat = "=1.251.0"
