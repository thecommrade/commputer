[workspace]
resolver = "2"
members = [
    "core",
    "consensus",
    "network",
    "proofs",
    "node",
    "validator",
    "storage",
    "sim",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/commputer/commputer"
description = "A communal supercomputer coordinated by blockchain"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1", features = ["derive"] }

# Cryptography
ed25519-dalek = { version = "2", features = ["serde"] }
sha2 = "0.10"
blake3 = "1"
rand = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Networking
libp2p = { version = "0.54", features = ["tokio", "gossipsub", "kad", "noise", "tcp", "yamux", "identify", "macros", "quic", "relay", "dcutr", "upnp"] }

# Storage
rocksdb = "0.24"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP / RPC
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# CSV
csv = "1"

# Compression
flate2 = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Internal crates
commputer-core = { path = "core" }
commputer-consensus = { path = "consensus" }
commputer-network = { path = "network" }
commputer-proofs = { path = "proofs" }
commputer-validator = { path = "validator" }
commputer-storage = { path = "storage" }
